apis:
- name: PayFast Subscriptions API
  description: >-
    REST API for managing recurring billing subscriptions, including fetching subscription details, pausing,
    unpausing, cancelling, updating subscription parameters, and processing adhoc charges against existing
    recurring billing agreements.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.payfast.co.za/documentation
  baseURL: https://api.payfast.co.za
  tags:
  - Subscription
  - Recurring Billing
  - Membership
  - Billing
  tags_raw:
  - Subscriptions
  - Recurring Billing
  - Membership
  - Billing
  properties:
  - type: Documentation
    url: https://developers.payfast.co.za/documentation
- name: PayFast Tokenization API
  description: >-
    REST API for managing tokenized recurring card payment agreements, allowing merchants to charge customers
    at future dates and amounts without storing card details directly. Supports adhoc charges on stored
    payment tokens.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.payfast.co.za/documentation
  baseURL: https://api.payfast.co.za
  tags:
  - Tokenization
  - Recurring Payments
  - Credit Card
  - Card Storage
  properties:
  - type: Documentation
    url: https://developers.payfast.co.za/documentation
- name: PayFast Transaction History API
  description: >-
    REST API for querying merchant transaction history with support for date range queries, daily summaries,
    weekly aggregations, and monthly aggregations, enabling merchants to reconcile payments programmatically.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.payfast.co.za/documentation
  baseURL: https://api.payfast.co.za
  tags:
  - Transaction
  - History
  - Reporting
  - Reconciliation
  tags_raw:
  - Transactions
  - History
  - Reporting
  - Reconciliation
  properties:
  - type: Documentation
    url: https://developers.payfast.co.za/documentation
- name: PayFast Credit Card Transactions API
  description: >-
    REST API for querying individual credit card transaction details by transaction ID, giving merchants
    programmatic access to card payment records.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.payfast.co.za/documentation
  baseURL: https://api.payfast.co.za
  tags:
  - Credit Card
  - Transaction
  - Lookup
  tags_raw:
  - Credit Card
  - Transactions
  - Lookup
  properties:
  - type: Documentation
    url: https://developers.payfast.co.za/documentation
- name: PayFast Refunds API
  description: >-
    REST API for merchants to initiate and track refunds on completed transactions, specifying refund
    amount, reason, and account type for disbursement back to the customer.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.payfast.co.za/documentation
  baseURL: https://api.payfast.co.za
  tags:
